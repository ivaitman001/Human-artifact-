  --c-academics:#78A6FF;--c-career:#A794FF;--c-skills:#B9D84F;--c-money:#52D58A;--c-mind:#4FD3D8;--c-fitness:#FFA84A;--c-social:#D98BF0;--c-love:#FF86AC;

<script>
'use strict';
/* ---------- Helpers, state, persistence ---------- */
const KEY='lockin.v1';
const pad=n=>String(n).padStart(2,'0');
const r1=x=>Math.round(x*10)/10;
const fmt=t=>{let h=Math.floor(t/60);const m=t%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap};
const hhmm=t=>pad(Math.floor(t/60))+':'+pad(t%60);
const parseHM=s=>{const p=String(s).split(':');return(+p[0])*60+(+p[1]||0)};
const durTxt=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':''):m+'m';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const daysAgo=i=>{const d=new Date();d.setDate(d.getDate()-i);return d};

let state=null;
function freshState(){
  const areas={},ra={};
  AREAS.forEach(a=>{areas[a.id]={cur:3,tgt:4,mode:'maintain'};ra[a.id]=true});
  return{v:1,profile:null,tab:'today',areas,habits:[],wins:[],done:{},demoDone:{},example:false,overrides:{},rem:{on:true,digest:true,areas:ra}};
}
function loadState(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const bk=()=>state&&state.profile?state.profile.bracket:'teen';
const Lim=()=>LIMITS[bk()];
const aObj=id=>AREAS.find(a=>a.id===id);
const aName=id=>id==='love'?LOVE[bk()].name:aObj(id).name;
const aShort=id=>id==='love'?LOVE[bk()].short:aObj(id).short;
const aDesc=id=>id==='love'?LOVE[bk()].desc:aObj(id).desc;
const aCol=id=>'var(--c-'+id+')';

/* ---------- Plan math ---------- */
const dayHabits=(habits,d)=>habits.filter(h=>h.days.includes(d)).sort((a,b)=>a.start-b.start);
const loadOf=list=>list.reduce((s,h)=>s+h.dur/60*W[h.int],0);
function sleepOverlap(h,L){
  const s=h.start,e=h.start+h.dur;
  const a=Math.max(0,Math.min(e,L.sleepEnd)-s);
  const b=Math.max(0,e-Math.max(s,L.sleepStart));
  return a+b;
}
const ptsOf=h=>Math.max(1,Math.round(h.dur/10*W[h.int]));
function isDone(k,id){return !!((state.done[k]&&state.done[k][id])||(state.demoDone[k]&&state.demoDone[k][id]))}

function weekStats(id){
  let done=0;
  for(let i=0;i<7;i++){
    const d=daysAgo(i),k=dkey(d),wd=d.getDay();
    state.habits.forEach(h=>{if(h.area===id&&h.days.includes(wd)&&isDone(k,h.id))done++});
  }
  const since=Date.now()-7*864e5;
  state.wins.forEach(w=>{if(w.area===id&&w.ts>=since)done++});
  const target=MODES.find(m=>m.id===state.areas[id].mode).per;
  return{done,target,pct:Math.min(1,done/target)};
}
function areaStatus(id){
  const a=state.areas[id],gap=a.tgt-a.cur,w=weekStats(id);
  if(gap>=2||(gap>=1&&w.pct<.4))return'support';
  if(a.cur>=4&&a.cur>=a.tgt)return'strong';
  return'steady';
}
const STATUS_TXT={support:'Needs support',strong:'Strong. Protect it',steady:'On track'};
function weekPoints(){
  let p=0;
  for(let i=0;i<7;i++){
    const d=daysAgo(i),k=dkey(d),wd=d.getDay();
    state.habits.forEach(h=>{if(h.days.includes(wd)&&isDone(k,h.id))p+=ptsOf(h)});
  }
  const since=Date.now()-7*864e5;
  state.wins.forEach(w=>{if(w.ts>=since)p+=w.pts});
  return p;
}
function streak(){
  let n=0;
  for(let i=0;i<60;i++){
    const d=daysAgo(i),list=dayHabits(state.habits,d.getDay());
    if(!list.length)continue;
    const k=dkey(d),dn=list.filter(h=>isDone(k,h.id)).length;
    if(dn/list.length>=.7)n++;else if(i>0)break;
  }
  return n;
}
const winPts=id=>10+(areaStatus(id)==='support'?5:0);

/* ---------- Seeds ---------- */
function starterHabits(b){return STARTERS[b].map(r=>({id:uid(),title:r[0],area:r[1],start:parseHM(r[2]),dur:r[3],int:r[4],days:[...r[5]]}))}
function seedDemo(){
  state.demoDone={};
  for(let i=1;i<=6;i++){
    const d=daysAgo(i),m={};
    dayHabits(state.habits,d.getDay()).forEach((h,j)=>{if(((i*7+j*3)%10)<7)m[h.id]=true});
    state.demoDone[dkey(d)]=m;
  }
  const ex=[['fitness','Hit three workouts this week',1],['academics','Finished the reading ahead of schedule',2],['social','Organized a hangout',3],['mind','Went to bed on time five nights',4],['money','Put money aside this week',5]];
  state.wins=state.wins.filter(w=>!w.example).concat(ex.map(e=>{const t=Date.now()-e[2]*864e5;return{id:uid(),ts:t,day:dkey(new Date(t)),area:e[0],text:e[1],pts:10,example:true}}));
  state.example=true;
}

/* ---------- Overload guard ---------- */
function evaluate(list0,b){
  const L=LIMITS[b],issues=[],load=loadOf(list0);
  const list=[...list0].sort((x,y)=>x.start-y.start);
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],c=list[j];
    if(a.start<c.start+c.dur&&c.start<a.start+a.dur)issues.push({code:'OVERLAP',sev:'conflict',ids:[a.id,c.id],msg:`<b>${esc(a.title)}</b> (${fmt(a.start)} to ${fmt(a.start+a.dur)}) overlaps <b>${esc(c.title)}</b> (${fmt(c.start)} to ${fmt(c.start+c.dur)}). You can't be in both places.`});
  }
  if(load>L.cap)issues.push({code:'LOAD',val:load,sev:load>L.cap*1.25?'block':'warn',msg:`Day load is <b>${r1(load)}</b> against a limit of <b>${L.cap}</b> for ages ${L.label}. Load is hours times effort: light 0.5, steady 1, hard 1.5 per hour.`});
  list.forEach(h=>{
    if(h.int>=2&&h.area!=='fitness'&&h.area!=='mind'&&h.dur>L.maxBlock)issues.push({code:'BLOCK_LEN',sev:h.dur>L.maxBlock*1.5?'block':'warn',ids:[h.id],msg:`<b>${esc(h.title)}</b> runs ${durTxt(h.dur)} in one go. Focus fades after about ${durTxt(L.maxBlock)}, so it needs breaks.`});
  });
  const fit=list.filter(h=>h.area==='fitness').reduce((s,h)=>s+h.dur,0);
  if(fit>L.exMin)issues.push({code:'EXERCISE',val:fit,sev:fit>=L.exMin*1.5?'block':'warn',msg:`<b>${durTxt(fit)}</b> of exercise is planned. The limit for ages ${L.label} is ${durTxt(L.exMin)} a day.`});
  const hard=list.filter(h=>h.int===3),hardMin=hard.reduce((s,h)=>s+h.dur,0);
  if(hardMin>L.hardMin)issues.push({code:'HARD_MIN',val:hardMin,sev:'warn',msg:`<b>${durTxt(hardMin)}</b> of hard-effort time. Keep it under ${durTxt(L.hardMin)}.`});
  if(hard.length>L.hardCount)issues.push({code:'HARD_COUNT',val:hard.length,sev:'warn',msg:`<b>${hard.length}</b> hard blocks in one day. The limit is ${L.hardCount}.`});
  list.forEach(h=>{
    const o=sleepOverlap(h,L);
    if(o>0&&(L.strictSleep||o>=45))issues.push({code:'SLEEP',sev:L.strictSleep?'block':'warn',ids:[h.id],msg:`<b>${esc(h.title)}</b> cuts ${durTxt(o)} into protected sleep (${fmt(L.sleepStart)} to ${fmt(L.sleepEnd)}). Ages ${L.label} need ${L.sleepHrs}+ hours.`});
  });
  if(load>=L.cap*.75&&!list.some(h=>h.area==='mind'&&h.dur>=20))issues.push({code:'NO_REST',val:1,sev:'warn',msg:'This is a heavy day with no rest block. Add at least 20 minutes of reset time.'});
  for(let i=0;i<list.length-1;i++){
    const a=list[i],c=list[i+1],gap=c.start-(a.start+a.dur);
    if(a.int===3&&c.int===3&&gap>=0&&gap<15)issues.push({code:'B2B',sev:'warn',ids:[a.id,c.id],msg:`<b>${esc(a.title)}</b> and <b>${esc(c.title)}</b> are both hard and ${gap===0?'back to back':'only '+gap+' minutes apart'}.`});
  }
  const ord={conflict:0,block:1,warn:2};
  issues.sort((x,y)=>ord[x.sev]-ord[y.sev]);
  return{issues,load,cap:L.cap,hardMin,fit};
}
function overrideInfo(issues,b,k){
  const L=LIMITS[b],ok=issues.every(i=>L.override.includes(i.sev)),left=L.overrideDaily-(state.overrides[k]||0);
  return{ok,left,allowed:ok&&left>0};
}
function findSlot(list,d,from,to,gap){
  for(let t=from;t+d<=to;t+=5)if(list.every(h=>t+d+gap<=h.start||t>=h.start+h.dur+gap))return t;
  return null;
}
function findSlotBack(list,d,from,to,gap){
  for(let t=to-d;t>=from;t-=5)if(list.every(h=>t+d+gap<=h.start||t>=h.start+h.dur+gap))return t;
  return null;
}
function problemDays(){
  const out=[];
  for(let d=0;d<7;d++)if(evaluate(dayHabits(state.habits,d),bk()).issues.length)out.push(d);
  return out;
}

/* Fix suggestions: each returns a new habit array, so the draft can be previewed before it is saved. */
function suggest(draft,day,ev,b,touched){
  const L=LIMITS[b],list=dayHabits(draft,day),out=[],seen=new Set();
  const add=f=>{if(f&&!seen.has(f.key)){seen.add(f.key);out.push(f)}};
  const heavy=[...list].sort((x,y)=>x.dur*W[x.int]-y.dur*W[y.int]).pop();
  const byId=id=>list.find(h=>h.id===id);
  const lightest=h=>{let best=null;ALL.forEach(d=>{if(h.days.includes(d))return;const l=loadOf(dayHabits(draft,d));if(!best||l<best.l)best={d,l}});return best};
  const fSplit=h=>{
    const n=Math.min(5,Math.max(2,Math.ceil(h.dur/L.maxBlock))),part=Math.max(15,Math.round(h.dur/n/5)*5);
    return{key:'split'+h.id,label:`Split “${esc(h.title)}” into ${n} sessions`,detail:`${n} sessions of ${durTxt(part)}, spread through the day with breaks between`,apply:arr=>{
      const others=arr.filter(x=>x.id!==h.id),near=others.filter(x=>x.days.some(d=>h.days.includes(d))),parts=[];
      let cursor=h.start;
      for(let i=0;i<n;i++){
        let st=h.start;
        if(i>0){const s=findSlot(near.concat(parts),part,cursor+45,L.sleepStart-30,15);st=s!==null?s:cursor+20}
        st=Math.min(st,1440-part);
        parts.push({...h,id:uid(),title:h.title+' ('+(i+1)+'/'+n+')',start:st,dur:part,days:[...h.days],part:true});
        cursor=st+part;
      }
      return others.concat(parts);
    }};
  };
  const fShorten=(h,to)=>to>=h.dur?null:{key:'short'+h.id+'-'+to,label:`Shorten “${esc(h.title)}” to ${durTxt(to)}`,detail:`Frees ${durTxt(h.dur-to)}`,apply:arr=>arr.map(x=>x.id===h.id?{...x,dur:to}:x)};
  const fLighten=h=>{
    if(h.int<=1)return null;
    const to=h.int-1;
    return{key:'light'+h.id,label:`Lower “${esc(h.title)}” from ${INTN[h.int]} to ${INTN[to]}`,detail:`Cuts load by ${r1(h.dur/60*(W[h.int]-W[to]))}`,apply:arr=>arr.map(x=>x.id===h.id?{...x,int:to}:x)};
  };
  const fSpread=h=>{
    if(h.days.length!==1)return null;
    const best=lightest(h);if(!best)return null;
    const half=Math.ceil(h.dur/2/5)*5;
    return{key:'spread'+h.id,label:`Spread “${esc(h.title)}” over two days`,detail:`${durTxt(half)} stays, ${durTxt(h.dur-half)} moves to ${DAYF[best.d]}`,apply:arr=>arr.map(x=>x.id===h.id?{...x,dur:half}:x).concat([{...h,id:uid(),title:h.title+' (part 2)',dur:h.dur-half,days:[best.d]}])};
  };
  const fMove=h=>{
    if(h.days.length>1)return{key:'skip'+h.id,label:`Skip “${esc(h.title)}” on ${DAYF[day]}`,detail:'It stays on your other days',apply:arr=>arr.map(x=>x.id===h.id?{...x,days:x.days.filter(d=>d!==day)}:x)};
    const best=lightest(h);if(!best)return null;
    return{key:'move'+h.id,label:`Move “${esc(h.title)}” to ${DAYF[best.d]}`,detail:`${DAYF[best.d]} is your lightest day (load ${r1(best.l)})`,apply:arr=>arr.map(x=>x.id===h.id?{...x,days:[best.d]}:x)};
  };
  const fShift=(h,mode)=>{
    /* A habit that repeats moves on every day it repeats, so the free slot must be free on all of them. */
    const others=draft.filter(x=>x.id!==h.id&&x.days.some(d=>h.days.includes(d)));
    const s=mode==='after'?findSlot(others,h.dur,h.start,L.sleepStart-15,10):findSlotBack(others,h.dur,L.sleepEnd,L.sleepStart-15,10);
    if(s===null||s===h.start)return null;
    return{key:'shift'+h.id+'-'+s,label:`Move “${esc(h.title)}” to ${fmt(s)}`,detail:'Same length, a free slot',apply:arr=>arr.map(x=>x.id===h.id?{...x,start:s}:x)};
  };
  const fRest=()=>{
    let s=findSlot(list,30,660,L.sleepStart-60,10),len=30;
    if(s===null){s=findSlot(list,20,420,L.sleepStart-30,5);len=20}
    if(s===null)return null;
    return{key:'rest',label:`Add a ${len} minute reset break at ${fmt(s)}`,detail:'Walk, water, no phone',apply:arr=>arr.concat([{id:uid(),title:'Reset break',area:'mind',start:s,dur:len,int:1,days:[day]}])};
  };
  const fGap=(a,c)=>{
    const s=a.start+a.dur+15,others=draft.filter(x=>x.id!==c.id&&x.days.some(d=>c.days.includes(d)));
    const free=s+c.dur<=L.sleepStart&&others.every(x=>s+c.dur<=x.start||s>=x.start+x.dur);
    if(free)return{key:'gap'+c.id+'-'+s,label:`Start “${esc(c.title)}” at ${fmt(s)}`,detail:'Leaves a 15 minute break between the two hard blocks',apply:arr=>arr.map(x=>x.id===c.id?{...x,start:s}:x)};
    return a.dur>=45?{key:'gapshort'+a.id,label:`Shorten “${esc(a.title)}” by 15m`,detail:'Leaves a 15 minute break between the two hard blocks',apply:arr=>arr.map(x=>x.id===a.id?{...x,dur:a.dur-15}:x)}:null;
  };
  const PRI={OVERLAP:0,BLOCK_LEN:1,EXERCISE:2,SLEEP:3,LOAD:4,HARD_MIN:5,HARD_COUNT:5,B2B:6,NO_REST:7};
  for(const i of [...ev.issues].sort((p,q)=>PRI[p.code]-PRI[q.code])){
    const h=i.ids&&byId(i.ids[0]);
    if(i.code==='BLOCK_LEN'&&h){
      /* Splitting spreads one long block through the day, but it does not cut the day's total load. Only offer it when the load already fits. */
      if(!h.part&&ev.load<=L.cap)add(fSplit(h));
      add(fShorten(h,L.maxBlock));if(h.dur>=120)add(fSpread(h));add(fLighten(h))}
    if(i.code==='LOAD'&&heavy){
      const ex=ev.load-L.cap,to=Math.max(30,Math.floor((heavy.dur-ex/(W[heavy.int]/60))/5)*5);
      add(fShorten(heavy,to));add(fLighten(heavy));add(fSpread(heavy));add(fMove(heavy));
    }
    if(i.code==='EXERCISE'){
      const fh=list.filter(x=>x.area==='fitness').sort((p,q)=>q.dur-p.dur)[0];
      if(fh){const rest=list.filter(x=>x.area==='fitness'&&x.id!==fh.id).reduce((s,x)=>s+x.dur,0);add(fShorten(fh,Math.max(15,L.exMin-rest)));add(fLighten(fh))}
    }
    if(i.code==='HARD_MIN'||i.code==='HARD_COUNT'){
      const hh=list.filter(x=>x.int===3).sort((p,q)=>q.dur-p.dur)[0];
      if(hh){add(fLighten(hh));add(fMove(hh))}
    }
    if(i.code==='SLEEP'&&h){add(fShift(h,'back'));add(fMove(h))}
    if(i.code==='OVERLAP'){
      /* Move the habit being added or edited before touching one that was already in the plan. */
      const pair=i.ids.map(byId).filter(Boolean),mine=pair.filter(x=>touched&&touched.has(x.id));
      (mine.length?mine:pair).forEach(x=>{add(fShift(x,'after'));add(fShift(x,'back'))});
    }
    if(i.code==='B2B'){const a=byId(i.ids[0]),c=byId(i.ids[1]);if(a&&c)add(fGap(a,c))}
    if(i.code==='NO_REST')add(fRest());
  }
  return out.slice(0,6);
}
</script>
<script>
'use strict';

  fitness:{kid:'Move every day with sports, bikes, or play. An hour is plenty and it should be fun.',

    young:'Say plainly what you want, and set a regular time that is not whatever is left over. Respect and consent are the baseline.',
    adult:'Schedule time that is not logistics. A weekly date or walk with phones away does more than the occasional big gesture.'}
};
const tipFor=id=>{const t=TIPS[id];return t[bk()]||t.adult};
const COMBOS={
  'academics|fitness':'Train first, then study: focus is sharper after exercise. Keep the workout a normal length and give the study block its own slot with a break in between.',
  'academics|social':'Study with a friend or a small group for an hour, then hang out. You get the work done and the social time stays on the calendar.',
  'career|fitness':'Look for roles with predictable hours, or flexibility, and put training on the calendar before you accept anything. Ask about schedules in the interview.',
  'career|social':'Choose teams and workplaces with people you like. Networking can double as social time if you do it over a walk or a meal.',
  'fitness|mind':'Treat rest days as part of training. Sleep is where the gains happen.',
  'skills|social':'Practice with other people: a band, a club, a study group, a pickup game.',
  'money|social':'Pick low-cost ways to see people on a standing day, and put the savings amount aside first.',

function comboFor(a,b){const k=[a,b].sort().join('|');return COMBOS[k]||'Attach the new habit to something you already do. After the habit you keep, do the habit you want. Keep it small and put it at a fixed time.'}
const gapOf=id=>state.areas[id].tgt-state.areas[id].cur;
function ranked(){

}
function nextHabit(){
  const now=new Date(),k=dkey(now),mins=now.getHours()*60+now.getMinutes();
  const list=dayHabits(state.habits,now.getDay()).filter(h=>!isDone(k,h.id));
  return list.find(h=>h.start+h.dur>mins)||list[0]||null;
}
const joinNames=ids=>{const n=ids.map(aName);return n.length<2?n.join(''):n.slice(0,-1).join(', ')+' and '+n[n.length-1]};

function aiFocus(){
  const b=bk(),{weak,strong}=ranked(),n=nextHabit(),w=weak[0],st=strong.slice(0,2);
  if(!n&&!w)return'You are on target everywhere and today’s list is done. Keep your habits small and your sleep steady.';
  const next=n?`${n.title} at ${fmt(n.start)}`:null,a=w?state.areas[w]:null;

  if(b==='teen')return `${next?`Next up: ${next}. `:'Today’s list is done. '}${w?`Your biggest gap is ${gap}. Do that block first, before the rest of the day pushes it out. `:''}If a day feels like too much, shorten the plan instead of skipping it.`;
  if(b==='young')return `${next?`Next up: ${next}. `:'Today’s list is done. '}${w?`Biggest gap right now is ${gap}. Put a block of it early, while you still have energy. `:''}${st.length?`${joinNames(st)} are strong, so a light version is enough there.`:''}`;
  return `${next?`Next block: ${next}. `:'Today’s list is done. '}${w?`Largest gap: ${gap}. Protect one early block for it. `:''}${st.length?`${joinNames(st)} are in good shape. A maintenance minimum is enough.`:''}`;
}
function aiGap(areaId){

function aiBalance(){

function aiOverwhelmed(){

const CRISIS=/\b(hurt myself|kill myself|suicid\w*|self[- ]?harm|want to die|end it all|no reason to live)\b/i;
const SENSITIVE=/\b(sex|sexual|sexy|hook ?ups?|porn|nudes?|drugs?|weed|vap(e|es|ing)|alcohol|drunk|beer|wine|booze|wasted|vodka|liquor|get high|high on)\b/i;

function aiAsk(text){

    const msg={kid:'That is a question for a parent, a doctor, or another adult you trust. I stay with school, play, sleep, and family. Want help with your plan for today?',
      teen:'I do not give advice on that. A parent, doctor, school counselor, or another adult you trust is the right person. I can help with school, sport, sleep, friends, and your plan.',

function genReminders(day,b,onlyAreas){

/* ----- Modal ----- */
function renderModal(){
  const m=ui.modal,ov=$('overlay');

  days.forEach(d=>suggest(m.draft,d,{issues:m.issues.filter(i=>i.day===d),load:loadOf(dayHabits(m.draft,d))},b,touched).forEach(f=>{if(!seenFix.has(f.key)&&m.fixes.length<6){seenFix.add(f.key);m.fixes.push(f)}}));

  const listJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  const note=!info.ok?(L.override.length?`At ages ${L.label}, ${listJoin(blockedKinds)} can’t be skipped. Pick a fix or cancel.`:`Limits can’t be skipped at ages ${L.label}. Pick a fix or cancel.`):info.left<=0?'You already used today’s override. It resets tomorrow.':`You can save this anyway. It will be marked Pushed in your plan.${L.overrideDaily<99?` Ages ${L.label} get ${L.overrideDaily} override a day.`:''}`;
  const prevTop=(!ov.hidden&&ov.querySelector('.modal'))?ov.querySelector('.modal').scrollTop:0;

    <div class="stack" style="gap:4px"><span class="lbl">Burnout override · ages ${L.label}</span><h2 id="mTitle">Too much on your plate</h2><p class="muted small">Adding ${esc(m.label)} breaks ${m.issues.length} limit${m.issues.length>1?'s':''}${days.length===1?` on ${DAYF[day]}`:''}.</p></div>
    <div>${m.issues.map(i=>`<div class="issue"><span class="sev ${i.sev}">${sevName[i.sev]}</span><p class="small">${days.length>1?`<b>${DAYN[i.day]}</b> · `:''}${i.msg}</p></div>`).join('')}</div>
    ${m.fixes.length?`<div class="stack"><span class="lbl">Fixes that keep your plan</span>${m.fixes.map((f,i)=>`<div class="fix"><div><b class="small">${f.label}</b><div class="small muted">${esc(f.detail)}</div></div><button class="btn sm" type="button" data-act="mFix" data-i="${i}">Apply</button></div>`).join('')}</div>`:''}

<script>
'use strict';
/* ---------- Guard flow: delta check, modal, commit ---------- */
function changedIds(base,draft){
  const m=new Map(base.map(h=>[h.id,JSON.stringify(h)]));
  return new Set(draft.filter(h=>m.get(h.id)!==JSON.stringify(h)).map(h=>h.id));
}
function deltaIssues(base,draft,days,b){
  const ch=changedIds(base,draft),out=[];
  days.forEach(d=>{
    const eb=evaluate(dayHabits(base,d),b),ed=evaluate(dayHabits(draft,d),b);
    ed.issues.forEach(i=>{
      let isNew;
      if(i.ids)isNew=i.ids.some(x=>ch.has(x));
      else{const p=eb.issues.find(z=>z.code===i.code);isNew=!p||(i.val||0)>(p.val||0)}
      if(isNew)out.push({...i,day:d});
    });
  });
  const ord={conflict:0,block:1,warn:2};
  return out.sort((x,y)=>ord[x.sev]-ord[y.sev]);
}
function evalModal(m){
  const b=bk(),ch=changedIds(m.base,m.draft),days=new Set();
  m.draft.forEach(h=>{if(ch.has(h.id))h.days.forEach(d=>days.add(d))});
  m.days=[...days];
  const issues=deltaIssues(m.base,m.draft,m.days,b);
  if(!issues.length){
    state.habits=m.draft;save();ui.modal=null;ui.form=null;ui.formErr='';
    renderModal();render();toast('<b>Saved.</b> Your plan is inside the limits.');return;
  }
  m.issues=issues;ui.modal=m;renderModal();
  const c=$('mCancel');if(c)c.focus({preventScroll:true});
}
function tryAdd(newHabits,replaceId,label){
  const base=state.habits,draft=base.filter(h=>h.id!==replaceId).concat(newHabits);
  evalModal({base,draft,label});
}

/* ---------- Actions ---------- */
function setTab(t){state.tab=t;save();render();window.scrollTo(0,0)}
function applyPersona(p){AREAS.forEach(a=>{state.areas[a.id]={cur:p.cur[a.id],tgt:p.tgt[a.id],mode:p.mode[a.id]}})}
function setMode(id,m){
  if(m==='sprint'){
    const n=AREAS.filter(a=>a.id!==id&&state.areas[a.id].mode==='sprint').length,L=Lim();
    if(n>=L.sprints){toast(`<b>Sprint limit.</b> Ages ${L.label} can run ${L.sprints} sprint${L.sprints>1?'s':''} at a time. Move another area off Sprint first.`);return}
  }
  state.areas[id].mode=m;save();render();
}
function logWin(text,area){
  text=(text||'').trim();
  if(!text){toast('Write what you got done first.');return}
  const pts=winPts(area);
  state.wins.unshift({id:uid(),ts:Date.now(),day:dkey(new Date()),area,text,pts});
  save();render();toast(`<b>+${pts}</b> in ${esc(aName(area))}. Logged.`);
}
function submitHabit(){
  const f=ui.form;
  const title=f.title.trim(),dur=Math.round(+f.dur),start=parseHM(f.start||'00:00');
  if(!title){ui.formErr='Give the habit a name.';render();return}
  if(!(dur>=5&&dur<=720)){ui.formErr='Length must be between 5 and 720 minutes.';render();return}
  if(!f.days.length){ui.formErr='Pick at least one day.';render();return}
  if(start+dur>1440){ui.formErr='A habit cannot run past midnight. Shorten it or split it across two days.';render();return}
  ui.formErr='';
  const h={id:f.id||uid(),title,area:f.area,start,dur,int:+f.int,days:[...f.days]};
  tryAdd([h],f.id,`“${esc(title)}”`);
}
function scenario(){
  const d=ui.day;
  tryAdd([{id:uid(),title:'Long workout',area:'fitness',start:420,dur:180,int:3,days:[d]},{id:uid(),title:'Midterm cram',area:'academics',start:630,dur:480,int:3,days:[d]}],null,'a 3 hour workout and an 8 hour study block');
}
function gateStart(){
  const g=ui.gate;
  if(!g.b){g.err='Choose an age range to continue.';render();return}
  if(g.b==='kid'&&!g.parent){g.err='A parent or guardian needs to help with setup for ages 10–13.';render();return}
  const first=!state.profile,changed=!first&&state.profile.bracket!==g.b;
  state.profile={bracket:g.b,ts:Date.now()};
  if(first||changed){
    state.habits=starterHabits(g.b);state.overrides={};
    if(first)applyPersona(PERSONAS[0]);
    if(first||state.example)seedDemo();else state.demoDone={};
    ui.adv=[];ui.form=null;ui.formErr='';
  }
  state.tab='today';ui.gating=false;ui.gate=null;save();render();window.scrollTo(0,0);
  toast(first?`<b>Welcome.</b> Limits and advice are set for ages ${Lim().label}.`:`<b>Switched to ages ${Lim().label}.</b> Habits, limits, and advice now match.`);
}
const ACTS={
  tab:el=>setTab(el.dataset.tab),
  openPlan:el=>{ui.day=+el.dataset.d;setTab('plan')},
  toggle:el=>{const k=dkey(new Date()),id=el.dataset.id;state.done[k]=state.done[k]||{};state.done[k][id]=!state.done[k][id];save();render()},
  selDay:el=>{ui.day=+el.dataset.d;if(!ui.form||!ui.form.id)ui.form=newForm(ui.day);render()},
  formDay:el=>{const d=+el.dataset.d,a=ui.form.days;ui.form.days=a.includes(d)?a.filter(x=>x!==d):a.concat([d]);render()},
  edit:el=>{const h=state.habits.find(x=>x.id===el.dataset.id);if(!h)return;ui.form={id:h.id,title:h.title,area:h.area,start:hhmm(h.start),dur:h.dur,int:h.int,days:[...h.days]};ui.formErr='';render();const t=$('f-title');if(t){t.scrollIntoView({block:'center'});t.focus()}},
  formCancel:()=>{ui.form=newForm(ui.day);ui.formErr='';render()},
  del:el=>{const h=state.habits.find(x=>x.id===el.dataset.id);state.habits=state.habits.filter(x=>x.id!==el.dataset.id);save();render();toast(`Removed <b>${esc(h?h.title:'habit')}</b>.`)},
  scenario:()=>scenario(),
  mFix:el=>{const m=ui.modal,f=m&&m.fixes[+el.dataset.i];if(!f)return;m.draft=f.apply(m.draft);evalModal(m)},
  mCancel:()=>{ui.modal=null;renderModal()},
  mForce:()=>{
    const m=ui.modal;if(!m)return;
    const info=overrideInfo(m.issues,bk(),dkey(new Date()));if(!info.allowed)return;
    const ch=changedIds(m.base,m.draft);
    state.habits=m.draft.map(h=>ch.has(h.id)?{...h,pushed:true}:h);
    const k=dkey(new Date());state.overrides[k]=(state.overrides[k]||0)+1;
    save();ui.modal=null;ui.form=null;renderModal();render();toast('<b>Saved past the limit.</b> It is marked Pushed in your plan.');
  },
  mode:el=>setMode(el.dataset.a,el.dataset.m),
  persona:el=>{const p=PERSONAS.find(x=>x.id===el.dataset.p);applyPersona(p);
    let sp=0;AREAS.forEach(a=>{if(state.areas[a.id].mode==='sprint'){sp++;if(sp>Lim().sprints)state.areas[a.id].mode='build'}});
    save();render();toast(`Loaded <b>${esc(p.label)}</b>.`)},
  advTopic:el=>{
    const t=el.dataset.t,label={focus:'What should I focus on today?',gap:'What is my biggest gap?',balance:'Keep my strengths while I build',over:'I feel overwhelmed',love:'Help with '+aName('love'),social:'Help with my social life'}[t];
    const fn={focus:aiFocus,gap:()=>aiGap(),balance:aiBalance,over:aiOverwhelmed,love:()=>aiGap('love'),social:()=>aiGap('social')}[t];
    ui.adv.push({who:'me',html:label},{who:'ai',html:esc(fn())});render();
  },
  remToggle:el=>{state.rem[el.dataset.k]=!state.rem[el.dataset.k];save();render()},
  remArea:el=>{state.rem.areas[el.dataset.a]=!state.rem.areas[el.dataset.a];save();render()},
  remDay:el=>{ui.remDay=+el.dataset.d;render()},
  testNotif:()=>{
    if(!state.rem.on){toast('Reminders are off. Turn them on to get a test.');return}
    const n=nextHabit(),b=bk(),h=n||{title:'your next habit',area:'academics'};
    toast(`<b>${esc('Time for '+h.title)}</b><br>${esc(bodyFor(h,b,'start')||bodyFor(h,b,'lead'))}`);
  },
  quickWin:el=>{const s=$('winArea');logWin(el.dataset.t,s?s.value:'mind')},
  delWin:el=>{state.wins=state.wins.filter(w=>w.id!==el.dataset.id);save();render()},
  gateAge:el=>{ui.gate.b=el.dataset.b;ui.gate.err='';if(el.dataset.b!=='kid')ui.gate.parent=false;render()},
  gateStart:()=>gateStart(),
  gateCancel:()=>{ui.gating=false;ui.gate=null;render()},
  changeAge:()=>{ui.gating=true;ui.gate={b:state.profile.bracket,parent:state.profile.bracket==='kid',err:''};render();window.scrollTo(0,0)},
  clearExamples:()=>{state.wins=state.wins.filter(w=>!w.example);state.demoDone={};state.example=false;save();render();toast('Examples cleared. Start logging your own.')},
  reset:()=>{
    if(!ui.resetArmed){ui.resetArmed=true;render();return}
    ui.resetArmed=false;state=freshState();save();ui.adv=[];ui.form=null;ui.gating=false;ui.gate=null;render();window.scrollTo(0,0);
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACTS[el.dataset.act];if(fn)fn(el);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id&&t.id.indexOf('f-')===0&&ui.form){
    const k=t.id.slice(2);if(k==='title'||k==='area'||k==='start'||k==='dur'||k==='int')ui.form[k]=t.value;return;
  }
  if(t.id==='clock'){ui.clock=+t.value;$('clockLbl').textContent=fmt(ui.clock);$('remList').innerHTML=remList();return}
  if(t.dataset&&t.dataset.area){
    state.areas[t.dataset.area][t.dataset.k]=+t.value;
    const lab=$(t.dataset.k+'v-'+t.dataset.area);if(lab)lab.textContent=t.value+' / 5';save();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.area)render();
  if(t.id==='gateParent'){ui.gate.parent=t.checked;ui.gate.err=''}
  if(t.id==='f-area'||t.id==='f-int'||t.id==='f-start'){/* values already captured on input */}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='habitForm')submitHabit();
  else if(id==='winForm'){const s=$('winArea'),x=$('winText');logWin(x.value,s.value)}
  else if(id==='advForm'){
    const x=$('advText'),q=x.value.trim();if(!q)return;
    ui.adv.push({who:'me',html:q});const r=aiAsk(q);ui.adv.push({who:'ai',html:r.html,kind:r.kind});render();
    const n=$('advText');if(n)n.focus();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});

/* ---------- Boot ---------- */
state=loadState()||freshState();
if(state.profile&&!LIMITS[state.profile.bracket])state=freshState();
if(!TABS.some(t=>t[0]===state.tab))state.tab='today';
render();
</script>

</body></html>
