<h1]The Environmental Cost of "Next-Day"</h1]
<p]Hover over the green boxes below to reveal the hidden data.</p]

<div class="card"]
<h2]3% Global CO2 Emissions</h2]
<div class="hidden"]The maritime shipping industry alone accounts for nearly 3% of global greenhouse gas emissions.</div]
</div]

<div class="card"]
<h2]30% Return Rate</h2]
<div class="hidden"]Up to 30% of all online orders are returned, effectively doubling the carbon footprint of a purchase.</div]
</div]

<div class="card"]
<h2]3 Billion Trees Harvested</h2]
<div class="hidden"]Approximately 3 billion trees are pulped annually just to produce the cardboard packaging used for global shipping.</div]
</div]
